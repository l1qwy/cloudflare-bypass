name: Update Cloudflare Zero Trust Lists

on:
  schedule:
    - cron: '0 2 * * *' # Запуск каждый день в 02:00 UTC
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2 # ИСПРАВЛЕНО: Актуальная минорная версия

      - name: Set up Python
        uses: actions/setup-python@v5.3.0 # ИСПРАВЛЕНО: Актуальная минорная версия
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python bypass.py
